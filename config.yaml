# Forklift Barkod Okuyucu - Yapılandırma
# Çalıştırma: python -m forklift_barcode --config config.yaml

source:
  # Görüntü kaynağı: screen | camera | rtsp | file
  #   screen : Kameranın yansıdığı ekranı yakalar (varsayılan)
  #   camera : USB kamera veya HDMI/AV capture kartı
  #   rtsp   : IP kamera akışı
  #   file   : Test için video dosyası
  type: screen
  screen:
    monitor: 1          # 1 = birincil ekran
    region: null        # ekranın tamamı; veya sadece kamera penceresi:
                        # {left: 0, top: 0, width: 1280, height: 720}
  camera_index: 0
  rtsp_url: "rtsp://kullanici:sifre@192.168.1.64:554/stream1"
  file_path: "test.mp4"
  fps_limit: 15         # saniyede işlenecek en fazla kare
  # Kamera ayna modundaysa (görüntü ters/aynalı) düzeltme:
  #   horizontal = sağ-sol aynalı, vertical = baş aşağı, both = ikisi de
  flip: horizontal

processing:
  # Otomatik dijital zoom: barkod bölgesi bulunur, bu ölçeklerde
  # yakınlaştırılıp/uzaklaştırılarak okuma başarılı olana dek denenir.
  zoom_scales: [1.0, 1.5, 2.0, 3.0, 0.5]
  roi_margin: 0.20      # tespit edilen barkod bölgesine eklenecek pay (oran)
  max_regions: 3        # bir karede denenecek en fazla aday bölge
  enhance: true         # zoom yapılan kesitlere keskinleştirme/kontrast uygula
  symbologies: []       # boş = tümü; örn: [CODE128] — doldurmak hem yanlış
                        # okumayı azaltır hem programı HIZLANDIRIR
  # --- Performans ayarları (kasma/donma yaşanıyorsa) ---
  max_width: 1280       # kare işlenmeden önce bu genişliğe küçültülür (0 = kapalı)
  full_search_every: 3  # ağır arama (bölge + tüm zoom denemeleri) her N karede bir

extraction:
  # Yazılacak numara: full = barkodun tamamı (varsayılan).
  # İleride barkodun yalnızca bir kısmı gerekirse:
  #   mode: slice  -> start/length ile karakter aralığı (start 1'den başlar)
  #   mode: regex  -> düzenli ifade yakalama grubu
  mode: full
  # start: 4
  # length: 10
  # regex: '(\d{8})$'
  # regex_group: 1
  digits_only: false    # true ise rakam olmayan karakterler atılır
  min_length: 1

output:
  # console: numarayı konsola yazar; csv: readings.csv dosyasına da kaydeder
  targets: [console]
  dedupe_seconds: 5.0   # aynı barkod bu süre içinde tekrar yazılmaz
  csv:
    path: readings.csv

preview:
  enabled: true               # canlı pencere: barkod kutusu + okunan numara
  window_name: "Forklift Barkod"
  draw_regions: true          # aday bölgeleri çiz
